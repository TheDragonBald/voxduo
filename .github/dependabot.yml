# Автообновление зависимостей.
#
# Шаг идёт последним в фазе намеренно: чтобы первая же пачка PR проверилась
# сама, нужны уже готовые `uv.lock`, CI на pull request и защита `main`. Всё
# три на месте, поэтому Dependabot здесь не «ещё одна автоматизация», а первая
# живая проверка, что связка «бот → CI → защита ветки» замкнулась.
#
# Обновления НЕ мержатся сами. Ruleset на `main` требует зелёный джоб `checks`,
# а список обхода пуст — так что каждый PR отсюда проходит те же ворота, что и
# ручной.

version: 2

updates:
  # --- Python: pyproject.toml + uv.lock ---
  #
  # Экосистема именно `uv`, а не `pip`: она понимает и точные пины в
  # `pyproject.toml`, и `uv.lock` целиком, включая транзитивные зависимости.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      # Утро понедельника: пачка приезжает к началу недели, а не посреди работы.
      time: "07:00"
      timezone: "Europe/Moscow"

    # Пять — не осторожность, а цена прогона. Каждый PR с правкой
    # `pyproject.toml` запускает не только `checks`, но и `build`: этот файл
    # стоит в фильтре путей у сборки .exe, а она идёт минуты на windows-раннере.
    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "area:infra"

    commit-message:
      # `prefix-development` здесь не задаём сознательно: uv не сообщает
      # Dependabot, какая зависимость рабочая, а какая для разработки, поэтому
      # второй префикс всё равно не применялся бы. Разделение видно по группе.
      prefix: "deps"

    # Группы разбирают пакеты ПО ПОРЯДКУ: пакет уезжает в первую подходящую.
    # Поэтому узкая группа инструментов стоит выше широкой рантаймовой.
    groups:
      # Инструменты разработки. Ломают в худшем случае проверки, а не
      # приложение, поэтому едут одной пачкой и смотрятся быстро.
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "pyinstaller"
          - "lefthook"
          - "types-*"

      # Всё остальное — одним PR, кроме тяжёлых и хрупких.
      #
      # Исключённые обновляются поштучно, каждый своим PR, и вот почему:
      # torch и библиотеки NVIDIA весят сотни мегабайт (их незачем тянуть
      # заодно с мелочью), а faster-whisper, piper-tts и edge-tts — это сами
      # движки распознавания и синтеза: их поломка самая заметная для
      # пользователя и её надо разбирать отдельно, а не искать в общей пачке.
      #
      # `ctranslate2` в исключения не вносим, хотя соблазн есть: он приезжает
      # транзитивно вместе с faster-whisper, и отдельной строкой правило было
      # бы мёртвым.
      runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "torch"
          - "nvidia-*"
          - "faster-whisper"
          - "piper-tts"
          - "edge-tts"

  # --- GitHub Actions ---
  #
  # Версии здесь закреплены точно (`@v5`, `@v10.0.1`), и это уже спасало: два
  # action на Node 20 нашлись за пятнадцать дней до снятия Node 20 с раннеров.
  # Держать их свежими вручную — работа, которую бот делает лучше.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Moscow"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "area:infra"

    commit-message:
      prefix: "ci"

    groups:
      # Actions обновляются мелко и редко ломаются поодиночке — одной пачки
      # достаточно, разбирать их по одному незачем.
      actions:
        patterns:
          - "*"

  # --- Фронтенд (spike/frontend) — ВЫКЛЮЧЕН НАМЕРЕННО ---
  #
  # Раскомментировать в Ф2, когда фронтенд переедет из `spike/` в `frontend/`
  # и попадёт под проверки CI (issue #39 — сейчас его не проверяет ни tsc, ни
  # сборка Vite). Обновлять то, что никто не проверяет, — значит копить
  # непроверенные изменения; сначала проверки, потом бот.
  #
  # Экосистема для pnpm — это `npm`: отдельного значения у Dependabot нет,
  # он читает `pnpm-lock.yaml` сам. Наш лок версии 9.0.
  #
  # - package-ecosystem: "npm"
  #   directory: "/spike/frontend"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #     time: "07:00"
  #     timezone: "Europe/Moscow"
  #   open-pull-requests-limit: 5
  #   labels:
  #     - "dependencies"
  #     - "area:infra"
  #   commit-message:
  #     prefix: "front"
