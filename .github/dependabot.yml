# Автообновление зависимостей.
#
# Шаг идёт последним в фазе намеренно: чтобы первая же пачка PR проверилась
# сама, нужны уже готовые `uv.lock`, CI на pull request и защита `main`. Все
# три на месте, поэтому Dependabot здесь не «ещё одна автоматизация», а первая
# живая проверка, что связка «бот → CI → защита ветки» замкнулась.
#
# Обновления НЕ мержатся сами. Ruleset на `main` требует зелёный джоб `checks`,
# а список обхода пуст — так что каждый PR отсюда проходит те же ворота, что и
# ручной.
#
# ВАЖНО про версию uv: Dependabot запускает свой uv (сейчас 0.12.7), и если
# `required-version` в `pyproject.toml` окажется выше, `uv lock` упадёт с кодом
# 2 на каждой зависимости — молча, без единого PR. Обоснование границы записано
# там же, рядом с ключом; поднимать её вслепую нельзя.

version: 2

updates:
  # --- Python: pyproject.toml + uv.lock ---
  #
  # Экосистема именно `uv`, а не `pip`: её парсер читает `[project]
  # dependencies`, `[project.optional-dependencies]`, `[dependency-groups]` и
  # `[build-system].requires`, а обновляет через `uv lock --upgrade-package` —
  # то есть и пины в `pyproject.toml`, и весь `uv.lock` целиком.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      # Утро понедельника: пачка приезжает к началу недели, а не посреди работы.
      time: "07:00"
      timezone: "Europe/Moscow"

    # Пять — не осторожность, а цена прогона. Каждый PR с правкой
    # `pyproject.toml` или `uv.lock` запускает не только `checks`, но и `build`:
    # оба файла стоят в фильтре путей у сборки .exe, а она идёт минуты на
    # windows-раннере.
    #
    # Считать при этом надо честно: кандидатов до восьми — два групповых PR
    # плюс шесть поштучных из `exclude-patterns` ниже. Групповые создаются
    # первыми, так что в тяжёлую неделю два слота из пяти уйдут им, и часть
    # движков подождёт до следующего понедельника. Это приемлемо: обновление
    # движка, приехавшее неделей позже, лучше, чем шесть параллельных сборок.
    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "area:infra"

    commit-message:
      prefix: "deps"
      # uv, вопреки первому впечатлению, различает рабочие зависимости и
      # инструменты разработки: пакеты из `[dependency-groups]` получают
      # `production? == false`, а `[project] dependencies` и обе экстры (`gpu`,
      # `silero`) — `true`. Поэтому отдельный префикс здесь не украшение: по
      # заголовку коммита сразу видно, чинить ли окружение пользователя или
      # только наши проверки.
      prefix-development: "deps-dev"

    # Как Dependabot раскладывает пакеты по группам: НЕ по порядку в этом файле,
    # а по специфичности паттерна — точное имя перекрывает `pytest*`, а тот
    # перекрывает `*`. Порядок записей роли не играет, и полагаться на него
    # нельзя. Практическое следствие: если однажды появится вторая группа с
    # паттерном той же специфичности, пакет попадёт в обе и приедет двумя PR.
    groups:
      # Инструменты разработки. Ломают в худшем случае проверки, а не
      # приложение, поэтому едут одной пачкой и смотрятся быстро.
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "pyinstaller"
          - "lefthook"
          - "types-*"

      # Всё остальное — одним PR, кроме тяжёлых и хрупких.
      #
      # Исключённые не выпадают из обновлений: пакет, не попавший ни в одну
      # группу, Dependabot обновляет отдельным PR. Именно это здесь и нужно.
      #
      # Почему эти шесть. `torch` и библиотеки NVIDIA весят сотни мегабайт —
      # незачем тянуть их заодно с мелочью. `faster-whisper`, `piper-tts`,
      # `edge-tts` и `ctranslate2` — это сами движки: распознавание, синтез и
      # инференс. Их поломка заметнее всего для пользователя, и разбирать её
      # надо отдельно, а не искать в PR на десяток пакетов. `ctranslate2` здесь
      # не за компанию: `voxduo/cuda_setup.py` дёргает его
      # `get_cuda_device_count()` напрямую, до импорта `faster_whisper`, и от
      # него зависит, поедет ли распознавание на видеокарте.
      runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "torch"
          - "nvidia-*"
          - "faster-whisper"
          - "piper-tts"
          - "edge-tts"
          - "ctranslate2"

  # --- GitHub Actions ---
  #
  # Здесь шесть из семи action сидят на плавающих мажорных тегах (`@v5`, `@v6`,
  # `@v8`), и точный пин ровно один — `astral-sh/setup-uv@v10.0.1`, потому что
  # у setup-uv плавающих мажорных тегов не существует начиная с v8.
  #
  # Почему это стоит отдать боту. Плавающий тег не значит «всегда свежий»: он
  # двигается внутри мажорной версии, а смена мажорной так и остаётся ручной
  # работой, которую никто не делает. Ровно поэтому два action незаметно
  # доехали до Node 20 и нашлись случайно, при ревью CI, за пятнадцать дней до
  # снятия Node 20 с раннеров. Бот поднимает мажорные версии сам и приносит их
  # на ревью, а не оставляет догнивать.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Moscow"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "area:infra"

    commit-message:
      prefix: "ci"

    groups:
      # Actions обновляются мелко и редко ломаются поодиночке — одной пачки
      # достаточно, разбирать их по одному незачем.
      actions:
        patterns:
          - "*"

  # --- Фронтенд (spike/frontend) — ВЫКЛЮЧЕН НАМЕРЕННО ---
  #
  # Раскомментировать в Ф2, когда фронтенд переедет из `spike/` в `frontend/`
  # и попадёт под проверки CI (issue #39 — сейчас его не проверяет ни tsc, ни
  # сборка Vite). Обновлять то, что никто не проверяет, — значит копить
  # непроверенные изменения; сначала проверки, потом бот.
  #
  # Экосистема для pnpm — это `npm`: отдельного значения у Dependabot нет,
  # он читает `pnpm-lock.yaml` сам. Наш лок версии 9.0.
  #
  # - package-ecosystem: "npm"
  #   directory: "/spike/frontend"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #     time: "07:00"
  #     timezone: "Europe/Moscow"
  #   open-pull-requests-limit: 5
  #   labels:
  #     - "dependencies"
  #     - "area:infra"
  #   commit-message:
  #     prefix: "front"
