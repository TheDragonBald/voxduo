name: build

# Сборка voxduo.exe для тех, у кого нет Python.
#
# Запускается по тегу вида v0.1.0 и прикладывает архив к релизу; на push в main
# и на pull request, трогающих упаковку, — просто проверяет, что бандл всё ещё
# собирается. Вручную запустить тоже можно кнопкой Run workflow.
#
# Линтер и тесты здесь не дублируются: их гоняет workflow checks на тех же
# событиях, включая теги. Держать вторую копию значило платить двойными
# windows-минутами за два набора проверок, которые уже начали расходиться.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    # Полную сборку на каждый PR не гоняем: минуты ради правки комментария —
    # плохая сделка. Гоняем там, где ломается именно упаковка: состав
    # зависимостей, spec, точка входа, сам workflow. Изменения в voxduo/**
    # ловит push в main — сборка отработает сразу после сквоша, задолго до
    # того, как кто-то поставит тег.
    #
    # uv.lock и .python-version здесь обязательны: прямые пины живут в
    # pyproject.toml, но обновление одних лишь транзитивных зависимостей
    # меняет только лок — а именно такие PR и приходят от Dependabot.
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "voxduo.spec"
      - "launcher.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# По умолчанию только чтение. Право записи выдаётся точечно джобу release,
# который запускается лишь на теге: иначе прогон на pull request исполнял бы
# код ветки с write-токеном на руках.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # Порядок важен: setup-python раскладывает системный интерпретатор, а
      # python-preference = "system" в pyproject.toml велит uv взять именно его.
      # Собранный .exe должен делаться на том же CPython, на котором проверялся.
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # По одной нативной команде на шаг: код возврата шага равен
      # $LASTEXITCODE последней команды блока, поэтому в блоке из двух вызовов
      # падение первого оставалось незамеченным.
      #
      # --group dev нужен ради pyinstaller: default-groups = [] намеренно не
      # тянет инструменты разработки в обычную установку.
      - name: Установка зависимостей
        run: uv sync --locked --group dev

      # Страховка на один вывод в лог: если PyInstaller однажды соберёт бандл
      # на managed-Python от uv вместо системного, это не упадёт, а тихо даст
      # другой размер и состав. Здесь видно, чей это интерпретатор.
      - name: Каким интерпретатором собираем
        run: uv run --frozen --no-sync python -c "import sys; print(sys.executable)"

      - name: Сборка
        run: uv run --frozen --no-sync python -m PyInstaller voxduo.spec --noconfirm

      - name: Проверка, что бинарник запускается
        # --check печатает сводку об окружении и выходит. Сейчас он всегда
        # возвращает 0, поэтому шаг ловит только полное падение бинарника, но
        # не потерянную зависимость. Машинный вердикт — отдельная задача,
        # issue #36.
        run: dist\voxduo\voxduo.exe --check
        shell: cmd

      - name: Упаковка
        run: Compress-Archive -Path dist\voxduo\* -DestinationPath voxduo-windows-x64.zip
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: voxduo-windows-x64
          path: voxduo-windows-x64.zip
          retention-days: 14

      - name: Подчистить кеш uv
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  release:
    # Отдельный джоб ровно ради прав: contents: write нужен только для
    # публикации, и достаётся он только прогонам по тегу. Раннер здесь
    # линуксовый — выкладке архива Windows не нужен.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voxduo-windows-x64

      - name: Публикация релиза
        uses: softprops/action-gh-release@v3
        with:
          files: voxduo-windows-x64.zip
          body: |
            Сборка для Windows x64. Python устанавливать не нужно.

            Распознавание в этой сборке работает на процессоре: библиотеки
            CUDA проприетарные и в бинарник не входят. Нужна видеокарта —
            ставьте из исходников, см. README.

            Модели скачиваются при первом запуске, около 1.6–3 ГБ.
