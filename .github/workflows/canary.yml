name: canary

# Ранний детектор поломки edge-tts.
#
# Microsoft периодически меняет требования к версии клиента, и edge-tts
# начинает получать 403, пока не выйдет обновление пакета. Раз в неделю
# синтезируем короткую фразу: если не вышло — заводится issue, и мы узнаём
# об этом раньше, чем кто-то столкнётся при использовании.
#
# Проверка стоит секунды и не трогает ничего, кроме сети.

on:
  schedule:
    # Понедельник, 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    # Остаётся на ubuntu, в отличие от остальных workflow: полное окружение
    # здесь не собирается, а значит и лок под win32 не читается. Линуксовый
    # раннер стартует заметно быстрее, а проверяем мы доступность чужого
    # сервиса, которой платформа безразлична.
    runs-on: ubuntu-latest
    # Сетевой пробник, которому нужны секунды. Дефолтные шесть часов на
    # зависшем шаге здесь не нужны никому.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # uv не предустановлен ни на одном образе раннеров — проверено по спискам
      # ПО actions/runner-images. Без этого шага следующий упал бы с
      # «uv: command not found», а шаг ниже завёл бы issue «edge-tts перестал
      # отвечать»: ровно та ложная тревога, которой здесь быть не должно.
      #
      # Кеш выключен: ставится один пакет, и восстановление кеша обошлось бы
      # дороже самой установки.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Проверка синтеза
        id: probe
        # Свой таймаут, вдвое короче джобового. При зависании сети падает ШАГ,
        # и следующий шаг видит failure(). Если бы сработал таймаут джоба, это
        # была бы отмена: шаги с `if: failure()` при ней не выполняются, и
        # issue не появился бы — при том что зависание и есть самый обычный
        # сетевой отказ, ради которого канарейка и заведена.
        timeout-minutes: 5
        # --no-project: полное окружение проекта здесь не нужно, скрипту
        # хватает edge-tts (сам он добавляет корень репозитория в sys.path, а
        # voxduo.tts.base и voxduo.tts.edge тянут только stdlib).
        #
        # Версия пинится и повторяет pyproject.toml. Без пина канарейка
        # проверяла бы свежайший edge-tts, которого нет ни у одного
        # пользователя, и молчала бы ровно тогда, когда сломано у всех.
        # Поднимая версию в pyproject.toml — поднять и здесь.
        run: uv run --no-project --with "edge-tts==7.2.8" scripts/check_edge.py

      - name: Завести issue, если синтез сломался
        if: ${{ failure() || cancelled() }}
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'edge-tts перестал отвечать';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'edge-tts',
            });
            if (existing.data.some(issue => issue.title === title)) {
              core.info('Issue уже заведён, второй не нужен');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['edge-tts'],
              body: [
                'Еженедельная проверка синтеза через edge-tts не прошла.',
                '',
                `Журнал запуска: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Что обычно помогает, по порядку:',
                '',
                '1. Обновить пакет: поднять версию в `pyproject.toml`, затем',
                '   `uv lock --upgrade-package edge-tts` и `just install`.',
                '   Заодно поднять пин в `.github/workflows/canary.yml`.',
                '2. Если обновления ещё нет — указать текущую версию Edge',
                '   в настройках приложения (её видно на `edge://settings/help`).',
                '3. Проверить, не разошлись ли часы: edge-tts подписывает запросы',
                '   временем, округлённым до пяти минут.',
                '',
                'Пользователей это не блокирует: синтез автоматически',
                'переключается на Silero или Piper.',
              ].join('\n'),
            });
