# Хуки НЕ являются гейтом: --no-verify и LEFTHOOK=0 обходят их целиком.
# Гейт — обязательный джоб checks в защите main. Здесь только скорость.
#
# Строки run: исполняет POSIX sh (Git Bash), а не PowerShell — обратно правилу
# justfile. Никаких $env:VAR, Test-Path, -ErrorAction. Двойные кавычки не
# ставить: строка уходит в `sh -c "..."` без экранирования, и путь с пробелом
# молча обрежет команду при нулевом коде возврата. Шаблоны файлов не кавычить
# вовсе — lefthook сам экранирует их одинарными.

min_version: "2.1.12"

# Команда запуска самого lefthook. Стоит в шаблоне хука выше пробы PATH и выше
# абсолютного пути, запечённого при установке: переименование папки её не рвёт,
# чужой lefthook из PATH не подменит, а --frozen не даёт переписать uv.lock
# посреди коммита.
#
# Побочный эффект принят сознательно: эта ветка делает недостижимым
# assert_lefthook_installed, поэтому его здесь нет. Роль «хуки на месте»
# исполняет `just check-hooks` внутри `just all`.
lefthook: uv run --frozen --no-sync lefthook

# Pre-commit ТОЛЬКО ПРОВЕРЯЕТ и никогда не правит файлы. Это не стиль, это
# защита от потери работы, и вот её цена и обоснование.
#
# lefthook прячет незастейдженные правки на время прогона и возвращает их
# после. Если хук за это время изменил файл в тех же строках, возврат патча
# конфликтует — и на этом пути 2.1.7+ зовёт `git checkout .`, который стирает
# незастейдженные правки во ВСЕХ отслеживаемых файлах, включая те, которых хук
# не касался. Стеш в том же прогоне сбрасывается, восстановить нечем.
# Это открытый баг upstream #1480, починка #1483 не смержена ни в один релиз
# по 2.1.12 включительно.
#
# Проверено здесь, на трёх раскладах (одинаковый конфликтный сценарий):
#   правящий хук, 2.1.12  → посторонний файл ПОТЕРЯН, ни стеша, ни патча;
#   правящий хук, 2.1.6   → посторонний уцелел, но потеряна версия правленого
#                           файла из дерева; остались стеш и патч, восстановимо;
#   ПРОВЕРЯЮЩИЙ хук, 2.1.12 → всё цело и когда коммит проходит, и когда отклонён.
# `stage_fixed` на исход не влияет: с true и false потеря одинакова.
#
# Отсюда решение: хук отказывает, а не чинит. Цена — форматировать руками
# (`just fmt`), выгода — **безвозвратно** потерять правки хук больше не может.
# Формулировка точная, а не бодрая: незастейдженные куски частично застейдженных
# файлов он по-прежнему прячет (стеш «lefthook auto backup» плюс
# `.git/info/lefthook-unstaged.patch`), и при аварийном обрыве — kill процесса,
# падение, потеря питания — в дереве останется версия из индекса. Но это
# восстановимо: `git apply --recount --unidiff-zero .git/info/lefthook-unstaged.patch`.
# Обычный Ctrl+C сюда не относится, lefthook его перехватывает
# (`signal.NotifyContext` в internal/command/run.go). Разница с прежним
# поведением в том, что исчезала работа в ФАЙЛАХ, КОТОРЫХ ХУК НЕ КАСАЛСЯ, и
# восстанавливать её было нечем.
#
# Записать это уроком было бы слабее: правило в документе на этом проекте уже
# дважды не срабатывало в момент действия, поэтому лечим причину, а не память.
#
# Вернуться к автопочинке можно будет, когда #1483 выйдет в релиз, — держим
# это в issue, а не в голове.
pre-commit:
  piped: true          # упал check — format не выполнится, вывод не потонет
  jobs:                # именно jobs, а не commands: в commands порядок — по имени
    - name: ruff-check
      glob: "*.py"     # без этого justfile и uv.lock уедут в ruff и уронят коммит
      run: uv run --frozen --no-sync python -m ruff check {staged_files}
      fail_text: "починить по выводу выше; форматирование — just fmt, затем git add"
    - name: ruff-format
      glob: "*.py"
      run: uv run --frozen --no-sync python -m ruff format --check {staged_files}
      fail_text: "отформатировать: just fmt, затем git add"

pre-push:
  jobs:
    - name: checks
      # Один джоб на весь набор, а не piped-цепочка по образцу pre-commit.
      # Причина — не стиль, а то, что лефтхук физически не даёт другого
      # способа отличить пуш тега или удаление ветки от обычного пуша.
      # Проверено по исходникам lefthook 2.1.12: skip/only с ref: сверяют
      # текущую ветку из .git/HEAD (internal/config/skip_checker.go,
      # matchesRef), а не пушимый ref, и понятия не имеют, что реально
      # уезжает; skip с run: исполняется с NullReader вместо стандартного
      # ввода (command_executor.go) — тоже вслепую. Единственное место,
      # где лефтхук отдаёт настоящий stdin git (`<local ref> <local sha>
      # <remote ref> <remote sha>` построчно), — джоб с use_stdin: true, а
      # доки честно предупреждают: данные достаются только ОДНОМУ такому
      # потребителю, остальные получают пустоту. Раздать stdin четырём
      # отдельным джобам (lock/types/tests + новый lint) нельзя было бы
      # даже теоретически, поэтому первым делом in-line читаем построчно
      # и решаем, а уже потом — через рецепты just, чтобы список проверок
      # не разъехался между justfile, ci.yml и этим файлом.
      #
      # Проверено прогоном на временном bare-репозитории (не в этом
      # репозитории, remote в проект не добавлялся): пуш тега и удаление
      # ветки пропускают весь набор и проходят; обычный пуш ветки гоняет
      # джоб как обычно и отклоняет пуш при сломанном тесте.
      #
      # just lint — первым в цепочке: ruff по всему дереву отвечает доли
      # секунды и отсекает самый дешёвый класс отказов до mypy и pytest.
      use_stdin: true
      run: |
        needs_checks=0
        while read -r local_ref local_sha remote_ref remote_sha; do
          case $remote_ref in
            refs/tags/*) continue ;;
          esac
          case $local_sha in
            0000000000000000000000000000000000000000) continue ;;
          esac
          needs_checks=1
        done
        if [ $needs_checks -eq 0 ]; then
          echo skip: пуш тега или удаление ветки, код не уезжает
          exit 0
        fi
        just lint && just locked && just types && just test
