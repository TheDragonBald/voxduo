[project]
name = "voxduo"
version = "0.1.0"
description = "Распознавание и синтез речи на русском языке для Windows"
requires-python = ">=3.13,<3.14"
license = { text = "GPL-3.0-or-later" }

# Версии закреплены точно: сборка .exe и чужие машины должны получать ровно то,
# что проверено. Обновление — работа Dependabot, отдельным осознанным PR.
dependencies = [
    # --- Распознавание речи ---
    "faster-whisper==1.2.1",
    # cuda_setup.py вызывает ctranslate2.get_cuda_device_count() напрямую, до
    # импорта faster_whisper. Пин наш, хотя faster-whisper его и так требует.
    "ctranslate2==4.8.2",
    "huggingface-hub==1.30.0",
    # Оба приезжают транзитивно, но voxduo.spec обращается к ним ПО ИМЕНИ:
    # copy_metadata("onnxruntime") и collect_data_files("certifi") падают с
    # PackageNotFoundError, если пакет уйдёт из дерева. Раз сборка на них
    # опирается — это часть контракта проекта, а не случайные попутчики.
    "onnxruntime==1.29.0",
    "certifi==2026.7.22",

    # --- Синтез речи (edge-tts онлайн, Piper офлайн) ---
    "edge-tts==7.2.8",
    "piper-tts==1.8.0",

    # --- Аудио ---
    "sounddevice==0.5.6",
    "soundfile==0.14.0",
    "numpy==2.5.3",
    # Декодер MP3 в tts/player.py: пакет импортируется там напрямую, плюс
    # приезжает транзитивно от faster-whisper (av>=11). Держим свой пин, чтобы
    # декодер не поехал сам собой вместе с обновлением распознавания.
    "av==18.1.0",

    # --- Интерфейс на Tkinter, живёт до конца Ф7 ---
    "customtkinter==6.0.0",
    # Нужен только для customtkinter.CTkImage, который пока не используется.
    # Оставлен сознательно: до конца Ф7 приложение остаётся Tkinter-овым и
    # картинка может понадобиться в любой момент. Вместе с уходом Tkinter — удалить.
    "pillow==12.3.0",
    "pyperclip==1.11.0",

    # --- Вертикальный срез Ф0: React + FastAPI + pywebview ---
    #
    # Держим в основных сознательно, хотя сейчас их импортирует только spike/:
    # с Ф2 этот стек становится основным интерфейсом, и дробить ради
    # промежутка не стоит. Цена — около 15 МБ и четырнадцать пакетов в дереве
    # (bottle, pydantic-core, pythonnet и прочие спутники pywebview).
    #
    # В voxduo.spec они при этом стоят в excludes, и это не противоречие:
    # бандл собирается из Tkinter-версии, которая их не трогает. Когда в Ф7
    # Tkinter уйдёт, строки из excludes уберутся вместе с ним.
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pywebview==6.2.1",
    # У голого uvicorn его нет — только у uvicorn[standard]. Без явной строки
    # первый же точный `uv sync` снёс бы websockets и убил WebSocket из Ф0.
    "websockets==17.1",
]

[project.optional-dependencies]
# Ускорение на NVIDIA (~1 ГБ).
#
# Вопреки документации faster-whisper («pip install — Linux only»), эти пакеты
# публикуют win_amd64 колёса, так что CUDA Toolkit ставить не нужно.
# Пути к DLL регистрирует voxduo/cuda_setup.py до импорта faster_whisper.
gpu = [
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.25.1.1",
]

# Третий движок TTS — Silero (~250 МБ).
#
# torch нужен ИСКЛЮЧИТЕЛЬНО ради Silero и вынесен отдельно: кому хватает
# edge-tts и Piper, четверти гигабайта качать не приходится.
# CPU-сборки достаточно — модель лёгкая, см. [tool.uv.sources] ниже.
silero = ["torch==2.14.0"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "pyinstaller==6.22.2",
    "mypy==2.3.1",
    # Стабы вместо глушилки: у pyperclip они есть, и с ними вызовы
    # pyperclip.copy() в интерфейсе действительно проверяются, а не молчат.
    "types-pyperclip==1.11.0.20260508",
    # Версия задублирована в min_version внутри lefthook.yml — сверяет
    # tests/test_pins_agree.py.
    #
    # Про безопасность версий, без двусмысленности: начиная с 2.1.7 и по 2.1.12
    # включительно lefthook при неудачном возврате спрятанных правок зовёт
    # `git checkout .` и стирает незастейдженные правки во всех отслеживаемых
    # файлах безвозвратно — upstream issue #1480, починка #1483 не смержена.
    # В 2.1.6 этого нет, но там свой баг #1369, ради которого починки и делались.
    # Проверено прогоном на обеих версиях, таблица — в комментарии lefthook.yml.
    #
    # Нас это не задевает, потому что pre-commit ничего не правит: без правки
    # файлов путь с конфликтом возврата недостижим (тоже проверено). Пин держим
    # на свежей версии; вернуться к автопочинке можно будет после выхода #1483.
    "lefthook==2.1.12",
]

# Индекс с CPU-сборками PyTorch. Раньше он жил строкой --index-url в
# requirements-silero.txt; без явной записи здесь uv взял бы torch с PyPI
# (index-strategy по умолчанию — first-index), и вместо 2.14.0+cpu в локе
# оказался бы 2.14.0: другой артефакт с другим хешем.
#
# explicit = true обязателен. Без него объявленный индекс встаёт ВЫШЕ PyPI, и
# оттуда поедет всё подряд, а не только torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
# Не библиотека: пакет не собирается и не ставится в окружение. Импорт держится
# на pythonpath = ["."] у pytest и на запуске из корня проекта.
package = false

# Приложение только под Windows. Лок собирается ровно под эту платформу —
# дверь односторонняя: вернуть прогон на ubuntu без пересборки лока не выйдет.
environments = ["sys_platform == 'win32'"]

# .exe собран на системном CPython 3.13.2, и PyInstaller должен видеть тот же
# интерпретатор. Managed-Python остаётся запасным вариантом для чужой машины.
python-preference = "system"

# Нижняя граница, а не «текущая версия». Ключ существует с uv 0.5, поэтому
# слишком старый uv honors его и честно откажет вместо непонятной ошибки.
#
# Граница 0.12.7 выбрана не произвольно: **Dependabot запускает uv 0.12.7**
# (`uv/Dockerfile` в dependabot-core — `FROM ghcr.io/astral-sh/uv:0.12.7`), и при
# несоответствии `uv lock --upgrade-package` падает с кодом 2 на КАЖДОЙ
# зависимости. Проверено живьём: с `>=99.0.0` uv отвечает «Required uv version
# does not match the running version» и код 2; с подходящей границей работает.
# Отказ при этом молчаливый — ни красного CI, ни письма, только логи бота, — так
# что пиши сюда версию выше 0.12.7 только вместе с проверкой, что образ
# dependabot-core уже обновился. Иначе автообновления Python-зависимостей просто
# перестанут приходить, и выглядеть это будет как «нечего обновлять».
required-version = ">=0.12.7"

# Инструменты разработки не ставятся молча вместе с базовой установкой:
# иначе `just install` стал бы равен `just install-dev`, а ключ -Dev в
# install.ps1 перестал бы что-либо значить.
default-groups = []

[tool.mypy]
python_version = "3.13"
# Платформу задаём явно, а не берём у машины: приложение только под Windows,
# и результат проверки не должен зависеть от того, где её запустили.
platform = "win32"
files = ["voxduo", "scripts", "launcher.py"]
# tests/ здесь намеренно нет. При disallow_untyped_defs каждая тестовая функция
# без `-> None` даёт ошибку, а добавление каталога упирается в конфликт имён
# модулей (tests и scripts без __init__.py). Тесты берутся в хвосте Ф1
# отдельной задачей, а не походя.
#
# legacy — исходный скрипт, хранится как есть; spike — вертикальный срез Ф0,
# он войдёт под проверку в Ф2 вместе с переездом в backend/. Оба и так вне
# files, так что exclude ниже — страховка на случай, если каталог добавят.
#
# ВАЖНО про будущий pre-push из PR 4: exclude действует только при обходе
# каталогов. Файл, названный в командной строке, проверяется всё равно —
# `mypy legacy/voice_to_text.py` даёт 9 ошибок. Аналога --force-exclude у ruff
# у mypy нет, поэтому в хуке звать только `just types`, без {staged_files}.
exclude = "^(legacy|spike|build|dist)/"

# В mypy 2.x это уже умолчание. Пишем явно, чтобы обновление до 3.x не
# поменяло поведение молча.
local_partial_types = true

warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
extra_checks = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

# strict = true брать нельзя: disallow_subclassing_any даёт ошибку на каждом
# классе, наследующем ctk.CTkFrame, а таких в интерфейсе большинство.

# Пакеты без аннотаций. Список проверен по наличию py.typed, а не по памяти.
[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "ctranslate2.*",
    "customtkinter.*",
    "sounddevice.*",
    "soundfile.*",
]
ignore_missing_imports = true

# torch ставится только с экстрой silero, и в CI его нет — без этого ключа там
# будет import-not-found. Проверено обоими прогонами: с пакетом и без.
#
# follow_imports = "skip" здесь стоял и убран: torch несёт py.typed, то есть
# настоящие аннотации, а ключ их выбрасывал и превращал все вызовы в Any.
# На результат он при этом не влиял ни с пакетом, ни без.
[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
# Исходный скрипт хранится как есть, для истории. per-file-ignores ниже
# отключает ему правила линтера, но форматтер файл всё равно трогает, а при
# передаче файлов списком (git-хуки) настройки исключений вообще не
# применяются без --force-exclude. Настоящий exclude закрывает оба случая.
extend-exclude = ["legacy"]
# Без этого ключа ruff игнорирует extend-exclude, когда файлы переданы
# списком, — а именно так их передаёт git-хук. У mypy поведение то же самое
# (exclude при файлах списком не действует), но лекарства нет: аналога
# force-exclude там не существует, поэтому в хуках mypy зовётся без аргументов.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # длину строк держим глазами, а не линтером: в русских комментариях
             # перенос по 100 символам режет фразы в неудобных местах
]

[tool.ruff.lint.per-file-ignores]
"legacy/*" = ["ALL"]  # исходный скрипт хранится как есть, для истории

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
